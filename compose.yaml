services:
  kale:
    build: .
    container_name: kale
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      KALE_HOST: 0.0.0.0
      KALE_PORT: 8080
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./data:/app/data:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
